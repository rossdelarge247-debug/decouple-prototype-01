name: Gitleaks

# Secret scan. This product carries bank tokens, callback payloads and real
# financial data through fixtures and logs; a leaked token is the one failure
# CI must never let reach main.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
