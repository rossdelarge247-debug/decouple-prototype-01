<!DOCTYPE html>
<html lang="en" data-stage="discover">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Decouple — Proto 01 · Discover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto/discover/discover.css">
<style>html,body{margin:0;background:#F5F5F4}a{color:#5B21B6}a:hover{color:#7C3AED}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="proto/journey-store.js"></script>
<script src="proto/ut/ut-questions.js"></script>
<script src="proto/ut/ut.js"></script>
<script src="proto/proto-chrome.js"></script>
<script type="text/babel" src="proto/discover/parts.jsx"></script>
<script type="text/babel" src="proto/discover/pages-a.jsx"></script>
<script type="text/babel" src="proto/discover/pages-b.jsx"></script>
<script type="text/babel" src="proto/discover/how.jsx"></script>
<script type="text/babel" src="proto/discover/picture.jsx"></script>
<link rel="stylesheet" href="proto/discover/picture.css">
<link rel="stylesheet" href="proto/discover/how.css">
<script type="text/babel" src="proto/tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "paper"
}/*EDITMODE-END*/;
const THEMES = { paper: "Paper · one look", mixed: "Per page · original", wash: "Lilac wash · one look" };
const TKEY = "decouple.proto.discoverTheme";
const VIEWS = {
  landing: { C: window.DLanding, bg: "bg-wash", label: "Discover · Landing" },
  picture: { C: window.DPicture, bg: "bg-paper", label: "Discover · The picture" },
  how:     { C: window.DHow,     bg: "bg-wash", label: "Discover · How it works" },
  why:     { C: window.DWhy,     bg: "bg-dark", label: "Discover · Why Decouple" },
  pricing: { C: window.DPricing, bg: "bg-paper", label: "Discover · Pricing" },
  faq:     { C: window.DFaq,     bg: "bg-paper", label: "Discover · FAQ" },
};
function App() {
  const route = window.useDRoute();
  const [router, setRouter] = useState(false);
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [mirror, setMirror] = useState(localStorage.getItem(TKEY));
  useEffect(() => { if (!window.Journey.embedded) localStorage.setItem(TKEY, t.theme); }, [t.theme]);
  useEffect(() => { const f = (e) => e.key === TKEY && setMirror(e.newValue); addEventListener("storage", f); return () => removeEventListener("storage", f); }, []);
  const theme = window.Journey.embedded ? (mirror || t.theme) : t.theme;
  const v = VIEWS[route] || VIEWS.landing;
  const bg = theme === "mixed" ? v.bg : theme === "wash" ? "bg-wash" : "bg-paper";
  const start = () => setRouter(true);
  return (
    <div className={"site " + bg} data-screen-label={v.label}>
      <window.DNav route={route} onStart={start}/>
      <v.C onStart={start}/>
      <window.DFooter/>
      <window.DMobileCTA onStart={start}/>
      {router && <window.DRouter onClose={() => setRouter(false)}/>}
      <TweaksPanel>
        <TweakSection label="Look & feel"/>
        <TweakSelect label="Page backgrounds" value={t.theme} options={Object.keys(THEMES).map((k) => ({ value: k, label: THEMES[k] }))} onChange={(v) => setTweak("theme", v)}/>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
