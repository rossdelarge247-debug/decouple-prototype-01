<!DOCTYPE html>
<html lang="en-GB" data-stage="mvp07">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decouple — MVP 07 · Ask</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto/discover/discover.css">
<link rel="stylesheet" href="proto/interview/iv.css">
<link rel="stylesheet" href="mvp/kit/kit.css">
<link rel="stylesheet" href="mvp/ask/ask.css">
<style>html,body{margin:0;background:#F5F5F4}a{color:#5B21B6}a:hover{color:#7C3AED}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="mvp/kit/kit.js"></script>
<script>window.Journey = KIT.journey("mvp07", "MVP 07", "Ask", "MVP · the AI tool, five modes", "MVP 07 · Ask.html", "decouple.mvp07.v1");</script>
<script src="proto/ut/ut-questions.js"></script>
<script src="proto/ut/ut.js"></script>
<script src="proto/proto-chrome.js"></script>
<script type="text/babel" src="proto/discover/parts.jsx"></script>
<script type="text/babel" src="mvp/kit/kit-ui.jsx"></script>
<script type="text/babel" src="mvp/ask/ask.jsx"></script>
<script type="text/babel" src="proto/tweaks-panel.jsx"></script>
<script type="text/babel">
/* MVP 07 · Ask. ?mode= and ?q= come from the toolkit home. Conversations are kept in memory only, never stored.
   Only the mode, a rating, and (for "Ask anything" and meetings) the question are logged, in testing mode. */
const { useState, useEffect } = React;
const qp = new URLSearchParams(location.search);
function App() {
  const [mode, setMode] = useState(AK.MODES[qp.get("mode")] ? qp.get("mode") : "ask"), [n, setN] = useState(0);
  useEffect(() => window.Journey.subscribe(() => setN((x) => x + 1)), []);
  const M = AK.MODES, q0 = n === 0 && mode === (qp.get("mode") || "ask") ? qp.get("q") || "" : "";
  return (
    <div className="site bg-paper" style={{ minHeight: "100vh" }} data-screen-label={"MVP 07 · " + M[mode].t}>
      <window.KitTop tool/>
      <main className="kit-wrap">
        <window.KitHead kick="Ask · any time" title="A sounding board," em="whenever you need one." lede="Answers from official sources, with links to check them. It knows what your guide knows, so you don’t have to explain everything again. It isn’t a solicitor, and it’ll tell you when you need one."/>
        <div className="ak-cols">
          <nav className="ak-modes" aria-label="Ways to use Ask">{Object.entries(M).map(([k, m]) => <button type="button" key={k} className={mode === k ? "on" : ""} aria-pressed={mode === k} onClick={() => { setMode(k); setN((x) => x + 1); KIT.log("ask-mode", "Opened a mode", "ai", k, { step: "Ask · " + k }); }}><span className="ic">{React.createElement(window.KIc[m.ic] || window.KIc.Chat, { s: 16 })}</span><span><b>{m.t}</b><small>{m.d}</small></span></button>)}
            <p className="ak-note">Conversations aren’t saved. Close the page and they’re gone.</p>
          </nav>
          <AKPanel key={mode + n} mode={mode} q0={q0}/>
        </div>
        <window.KitProto>Answers come from Claude in the design preview, with a fixed set of rules and sources for each mode.</window.KitProto>
      </main>
      <TweaksPanel title="Tweaks · MVP 07">
        <TweakSection label="Mode"/>
        <TweakSelect label="Open" value={mode} options={Object.entries(M).map(([value, m]) => ({ value, label: m.t }))} onChange={(v) => { setMode(v); setN((x) => x + 1); }}/>
        <TweakSection label="From the guide"/>
        <TweakSelect label="Stage" value={KIT.stage()} options={Object.entries(KIT.STAGE_L).map(([value, label]) => ({ value, label }))} onChange={(v) => { KIT.write({ stage: v }); setN((x) => x + 1); }}/>
        <TweakToggle label="Children under 18" value={KIT.kids()} onChange={(v) => { KIT.write({ kids: v }); setN((x) => x + 1); }}/>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
