  else if (page === "det") body = <FNWizard det={det} N={N} kids={kids} whyEl={m && <FNWhyList m={m} N={N} S={S} agreed={agreed} edits={fin.edits} setEditOf={setEditOf} locked={!!sign.a} advFor={advFor} advOk={fin.advOk || {}} onAdv={(id) => up((f) => ({ advOk: { ...(f.advOk || {}), [id]: true } }))}/>} set={(p) => up((f) => ({ det: { ...(f.det || {}), ...p } }))} onDone={() => { if (fin.gen) syncFacts(det); up({ detDone: true, why: true, page: "hub" }); scrollTo({ top: 0 }); }}/>;
  else if (page === "gen") body = <FNGen pen={!!m.pct} onDone={() => { up({ gen: true, page: "hub", detGen: det }); say("Your court bundle is ready", `${docs.length} documents drafted from v${finalN}.`); }}/>;
  else if (page === "docs") body = <FNDocArea N={N} m={m} det={det} sign={sign} S={S} agreed={agreed} docs={docs} doc={fin.doc} setDoc={(d) => up({ doc: d })} ctx={ctx} fin={fin} act={act} st={docSt} markup={markup} setMarkup={setMarkup} mode={t.docMode} editAll={t.editAll} me={ME} bConf={!!fin.bConf} setDet={(p) => up((f) => ({ det: { ...(f.det || {}), ...p } }))} onConf={(n) => { up({ bConf: true }); say(n ? `${n} correction${n > 1 ? "s" : ""} saved` : "Details confirmed", n ? `${N.Me} can see what you changed. You can now sign.` : "You can now sign."); }} locked={!!(fin.filed || fin.posted)} reviewed={allDone} onDone={() => go("pre")} say={say} ver={ver} renderThumb={(id) => <FNDoc id={id} ctx={{ ...ctx, markup: false, editing: null, comments: [], focus: null }} m={m} det={det} sign={sign} S={S} agreed={agreed} N={N}/>}/>;
  else if (page === "why") body = <FNWhy m={m} N={N} S={S} agreed={agreed} edits={fin.edits} setEditOf={setEditOf} advFor={advFor} advOk={fin.advOk || {}} onAdv={(id) => up((f) => ({ advOk: { ...(f.advOk || {}), [id]: true } }))} locked={!!sign.a} seen={share.st !== "none"} done={!!fin.why} onDone={() => { up({ why: true }); go("docs"); }}/>;
  else if (page === "pre") body = <FNPre m={m} det={det} N={N} S={S} agreed={agreed} state={fin.pre} run={() => up({ pre: "pass" })} next={() => { go("hub"); setTimeout(() => { const el = document.getElementById("fn-st-file"); if (el) scrollTo({ top: el.getBoundingClientRect().top + scrollY - 100, behavior: "smooth" }); }, 120); }}/>;
  else if (page === "file") body = <FNFile N={N} path={fin.path} posted={fin.posted} act={act} say={say}/>;
  else if (page === "track" && fin.filed) body = <FNTrack N={N} det={det} filed={fin.filed} stage={fin.track} act={act} say={say}/>;
  else body = <FNHub N={N} steps={steps} m={m} det={det} go={go} fileOpts={<FNFileOpts act={act}/>} preEl={<FNPreIn m={m} det={det} S={S} agreed={agreed} state={fin.pre} explained={(s) => { const a = advFor(s), e = fin.edits[a.at]; return (e ? e.to : baseOf(a.at)).includes(a.line) || (a.covers && a.covers.test(e ? e.to : baseOf(a.at))); }} sugs={fin.sugs || []} onResolve={act.resolveAdv} openAt={(at) => act.focus({ at })} run={() => { up({ pre: "pass" }); say("All checks passed", "Your filing options are unlocked."); }}/>} thumbs={<FNThumbs docs={docs} st={docSt} open={setQv} render={(id) => <FNDoc id={id} ctx={{ ...ctx, canEdit: false, markup: false, editing: null, comments: [], focus: null }} m={m} det={det} sign={sign} S={S} agreed={agreed} N={N}/>}/>}/>;
  const showRail = !gate && page !== "det" && page !== "gen" && page !== "hub" && page !== "docs" && page !== "track" && page !== "why";

  return (
    <div className={"site ob rc st fn " + (t.wash === "sky" ? "st-wash" : "bg-paper")} data-screen-label={"Finalise · " + page}>
      <OBTop N={N} onExit={() => setExit(true)}/>
      <div className="ob-shell two wide">
        <OBRail plan={plan} active="finalise" full sub={nav || <span></span>}/>
        <main className="pp-stage rc-stage">
          <div className={"rc-wrap" + (showRail ? "" : " fn-solo") + (page === "docs" ? " fn-wide" : "")}>
            {body}
            {showRail && <aside className="rc-rail"><FNRail page={page} N={N} m={m} edits={fin.edits} comments={fin.comments} act={act} share={share} changed={changed} sign={sign} path={fin.path} filed={fin.filed}/></aside>}
          </div>
        </main>
      </div>
      {signM && (() => { const ok = signM.read && signM.truth, u = (x) => setSignM((v) => ({ ...v, ...x }));
        return <div className="mscrim" onClick={(e) => e.target === e.currentTarget && setSignM(null)}><div className="mbox wide st-signm" role="dialog" aria-modal="true" aria-label="Sign the court documents">
          <button className="mx" aria-label="Close" onClick={() => setSignM(null)}><Ic.X s={16}/></button>
          <div className="pq-k" style={{ color: "#047857" }}>Court documents · statements of truth</div>
          <h3>Sign as applicant</h3>
          <p>Your signature goes on the consent order, Form A, and the D81 (questions 23 and the applicant's statement of truth).</p>
          <div className="la-note"><b>Statement of truth</b><span>Proceedings for contempt of court may be brought against anyone who makes, or causes to be made, a false statement in a document verified by a statement of truth without an honest belief in its truth.</span></div>
          <label className={"rc-sign" + (signM.read ? " on" : "")}><input type="checkbox" checked={signM.read} onChange={(e) => u({ read: e.target.checked })}/><span>I've read all the documents, including {`${O}'s`} details</span></label>
          <label className={"rc-sign" + (signM.truth ? " on" : "")}><input type="checkbox" checked={signM.truth} onChange={(e) => u({ truth: e.target.checked })}/><span>I believe the facts in Form A and the D81 are true, and I have made full disclosure of all relevant facts</span></label>
          <div className="fn-sigprev"><small>Your signature</small><i>{det.aFull}</i></div>
          <div className="mrow"><button className="btn lg go" disabled={!ok} onClick={() => { up((f) => ({ sign: { ...f.sign, a: true, ad: now() } })); setSignM(null); setEdit(false); say("You've signed", `We've asked ${O} to sign.`); }}>Sign the documents<Ic.Arrow s={14}/></button><button className="btn lg ghost" onClick={() => setSignM(null)}>Not yet</button></div>
        </div></div>; })()}
      {payM && (() => { const u = (x) => setPayM((v) => ({ ...v, ...x }));
        return <div className="mscrim" onClick={(e) => e.target === e.currentTarget && !payM.busy && setPayM(null)}><div className="mbox wide st-signm fn-pay" role="dialog" aria-modal="true" aria-label="We file it for you">
          <button className="mx" aria-label="Close" onClick={() => setPayM(null)}><Ic.X s={16}/></button>
          <div className="pq-k" style={{ color: "#047857" }}>We file it for you</div>
          <h3>{`Filed by our partner firm, ${FN.FIRM}`}</h3>
          <p>{`A solicitor from ${FN.FIRM} files your application online through the court's professional service, usually the same working day. They act for you as applicant, for filing only. ${O} is told he can take his own advice.`}</p>
          <div className="fn-cost lg"><span>Filing by our partner solicitor</span><b>{`£${FN.FILE_FEE - FN.FEE}`}</b><span>Court fee · we pay HMCTS for you</span><b>{payM.hwf ? "£0" : `£${FN.FEE}`}</b><span className="t">Total today · all in</span><b className="t">{`£${FN.FILE_FEE - (payM.hwf ? FN.FEE : 0)}`}</b></div>
          <label className="fn-f"><span className="l">Help with Fees reference<em>optional</em></span><input className="mono" value={payM.hwf} placeholder="HWF-A1B-2CD" onChange={(e) => u({ hwf: e.target.value })}/><small>If you've been approved for Help with Fees, the court fee is reduced or waived.</small></label>
          <div className="fn-card"><Ic.Lock s={13}/><span>Visa ending 4242</span><small>Saved from sign-up</small></div>
          <label className={"rc-sign" + (payM.ok ? " on" : "")}><input type="checkbox" checked={payM.ok} onChange={(e) => u({ ok: e.target.checked })}/><span>{`I authorise ${FN.FIRM} to file this application with the court on my behalf`}</span></label>
          <div className="mrow"><button className="btn lg go" disabled={!payM.ok || payM.busy} onClick={() => { u({ busy: true }); setTimeout(() => { up({ path: "file", filed: { ref: `FR-${det.caseNo.replace(/\s/g, "").slice(-8)}`, at: now() }, track: 0, page: "track" }); setPayM(null); scrollTo({ top: 0 }); say("Filed with the court", `We've told ${O}.`); }, 1600); }}>{payM.busy ? <><span className="spin"></span>Filing with the court…</> : <>{`Pay £${FN.FILE_FEE - (payM.hwf ? FN.FEE : 0)} and file`}<Ic.Arrow s={14}/></>}</button><button className="btn lg ghost" disabled={payM.busy} onClick={() => setPayM(null)}>Cancel</button></div>
        </div></div>; })()}
      {qv && m && <FNQuick docs={docs} id={qv} setId={setQv} close={() => setQv(null)} st={docSt} say={say} onOpen={(id) => { setQv(null); act.openDoc(id); }} render={(id) => <FNDoc id={id} ctx={{ ...ctx, canEdit: false, editing: null, focus: null }} m={m} det={det} sign={sign} S={S} agreed={agreed} N={N}/>}/>}
      {toast && <div className="pp-toast" role="status"><b>{toast[0]}</b>{toast[1] && <span>{toast[1]}</span>}{toast[2] && <button className="lnk fn-tlk" onClick={() => { setToast(null); toast[2][1](); }}>{toast[2][0]}</button>}</div>}
      <TweaksPanel>
        <TweakSection label="Simulate"/>
        <TweakButton label={`Simulate ${O}`} onClick={act.simMark}/>
        <TweakButton label="Simulate the court" onClick={act.advance}/>
        <TweakSection label="Plan"/>
        <TweakRadio label="Plan" value={plan} options={[{ value: "guided", label: "Guided" }, { value: "complete", label: "Complete" }]} onChange={(x) => { J.set("household", { plan: x }); setPlan(x); }}/>
        <TweakSection label="Jump to"/>
        <TweakButton label="Bundle generated" onClick={() => setFin({ ...BLANK, example: fin.example || !real, detDone: true, gen: true, detGen: det })}/>
        <TweakButton label="Ready to sign documents" onClick={() => setFin({ ...BLANK, example: fin.example || !real, detDone: true, gen: true, detGen: det, why: true, mk: true, page: "docs", doc: "order" })}/>
        <TweakButton label="All signed — run pre-flight" onClick={() => setFin({ ...BLANK, example: fin.example || !real, detDone: true, gen: true, detGen: det, reviewed: true, why: true, share: { st: "approved", rev: 0, sent: 0 }, sign: { a: true, ad: now(), b: true, bd: now() }, page: "hub" })}/>
        <TweakButton label="Signed — ready to file" onClick={() => setFin({ ...BLANK, example: fin.example || !real, detDone: true, gen: true, detGen: det, reviewed: true, why: true, pre: "pass", share: { st: "approved", rev: 0, sent: 0 }, sign: { a: true, ad: now(), b: true, bd: now() }, page: "hub" })}/>
        <TweakButton label="Reset Finalise" onClick={() => { setFin({ ...BLANK, example: fin.example }); setEdit(false); }}/>
        <TweakSection label="Your documents"/>
        <TweakRadio label="Editor" value={t.docMode} options={[{ value: "one", label: "One at a time" }, { value: "chain", label: "All in one" }]} onChange={(x) => setTweak("docMode", x)}/>
        <TweakRadio label="View as" value={t.viewAs} options={[{ value: "a", label: N.Me }, { value: "b", label: N.Them }]} onChange={(x) => setTweak("viewAs", x)}/>
        <TweakRadio label="Editing" value={t.editAll ? "all" : "lim"} options={[{ value: "lim", label: "Restricted" }, { value: "all", label: "Everything" }]} onChange={(x) => setTweak("editAll", x === "all")}/>
        <TweakSection label="Look"/>
        <TweakRadio label="Background" value={t.wash} options={[{ value: "sky", label: "Wash" }, { value: "paper", label: "Paper" }]} onChange={(x) => setTweak("wash", x)}/>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
