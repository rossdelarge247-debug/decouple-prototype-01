<!DOCTYPE html>
<html lang="en-GB" data-stage="mvp03">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decouple — MVP 03 · To-do list &amp; journal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto/discover/discover.css">
<link rel="stylesheet" href="proto/interview/iv.css">
<link rel="stylesheet" href="mvp/kit/kit.css">
<link rel="stylesheet" href="mvp/todo/td.css">
<style>html,body{margin:0;background:#F5F5F4}a{color:#5B21B6}a:hover{color:#7C3AED}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="mvp/kit/kit.js"></script>
<script>window.Journey = KIT.journey("mvp03", "MVP 03", "To-do & journal", "MVP · prefilled to-dos and a private journal", "MVP 03 · To-do & Journal.html", "decouple.mvp03.v1");</script>
<script src="proto/ut/ut-questions.js"></script>
<script src="proto/ut/ut.js"></script>
<script src="proto/proto-chrome.js"></script>
<script type="text/babel" src="proto/discover/parts.jsx"></script>
<script type="text/babel" src="mvp/kit/kit.jsx"></script>
<script type="text/babel" src="mvp/todo/td.jsx"></script>
<script type="text/babel" src="proto/tweaks-panel.jsx"></script>
<script type="text/babel">
/* MVP 03 · To-do list & journal. State in decouple.mvp03.v1: tab, done ticks, their own tasks, journal entries (seeded with Sarah's). */
const { useState, useEffect } = React;
const KEY = "decouple.mvp03.v1";
const fresh = () => ({ tab: "todo", done: {}, mine: [], entries: null });
const load = () => ({ ...fresh(), ...(KIT.load(KEY) || {}) });
function App() {
  const [s, setS] = useState(load), [, setKit] = useState(0);
  const up = (p) => setS((o) => { const n = { ...o, ...p }; KIT.save(KEY, n); return n; });
  useEffect(() => KIT.subscribe(() => setKit((n) => n + 1)), []);
  useEffect(() => window.Journey.subscribe(() => setS(fresh())), []);
  const P = KIT.PERSONA;
  return (
    <div className="site bg-paper" style={{ minHeight: "100vh" }} data-screen-label={"MVP 03 · " + (s.tab === "todo" ? "To-do" : "Journal")}>
      <window.KitTop tool/>
      <main className="kit-wrap">
        <window.KitHead kick="Get organised" title={s.tab === "todo" ? "Your list for" : "Your journal,"} em={s.tab === "todo" ? "this week." : P.me + "."} lede={s.tab === "todo" ? "Made from your guide, in the order things usually happen. Tap the ? on anything to see why it matters." : "Dates, feelings, and anything you might need later. Private to you, always."}/>
        <div className="td-tabs" role="tablist">{[["todo", "To-do list"], ["journal", "Journal"]].map(([k, l]) => <button type="button" role="tab" key={k} aria-selected={s.tab === k} className={s.tab === k ? "on" : ""} onClick={() => up({ tab: k })}>{l}</button>)}</div>
        {s.tab === "todo" ? <TDTodo st={s} up={up}/> : <TDJournal st={{ ...s, entries: s.entries || (KIT.acct() ? TD.SEED : []) }} up={up}/>}
      </main>
      <TweaksPanel title="Tweaks · MVP 03">
        <TweakSection label="From the guide"/>
        <TweakSelect label="Stage" value={KIT.stage()} options={Object.entries(KIT.STAGE_L).map(([value, label]) => ({ value, label }))} onChange={(v) => KIT.write({ stage: v })}/>
        <TweakToggle label="Children under 18" value={KIT.kids()} onChange={(v) => KIT.write({ kids: v })}/>
        <TweakSection label="Journal"/>
        <TweakButton label="Empty journal" onClick={() => up({ entries: [] })}/>
        <TweakButton label="Start again" onClick={() => { KIT.drop(KEY); setS(fresh()); }}/>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
