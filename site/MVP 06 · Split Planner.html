<!DOCTYPE html>
<html lang="en-GB" data-stage="mvp06">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decouple — MVP 06 · Split planner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto/discover/discover.css">
<link rel="stylesheet" href="proto/interview/iv.css">
<link rel="stylesheet" href="mvp/kit/kit.css">
<link rel="stylesheet" href="mvp/split/sp.css">
<style>html,body{margin:0;background:#F5F5F4}a{color:#5B21B6}a:hover{color:#7C3AED}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="mvp/kit/kit.js"></script>
<script>window.Journey = KIT.journey("mvp06", "MVP 06", "Split planner", "MVP · simple settlement and the agreement pack", "MVP 06 · Split Planner.html", "decouple.mvp06.v1");</script>
<script src="proto/ut/ut-questions.js"></script>
<script src="proto/ut/ut.js"></script>
<script src="proto/proto-chrome.js"></script>
<script type="text/babel" src="proto/discover/parts.jsx"></script>
<script type="text/babel" src="mvp/kit/kit.jsx"></script>
<script type="text/babel" src="mvp/split/sp.jsx"></script>
<script type="text/babel" src="proto/tweaks-panel.jsx"></script>
<script type="text/babel">
/* MVP 06 · Split planner. State in decouple.mvp06.v1: phase (figures, plan, summary) and d (the decisions). */
const { useState, useEffect } = React;
const KEY = "decouple.mvp06.v1";
const fresh = () => ({ phase: "figures", d: { ...SP.DEF } });
const load = () => { const s = KIT.load(KEY); return s && s.d ? s : fresh(); };
const PRESET = { fair: { home: "delay", homeP: 60, penP: 36, savP: 55, debt: "own" }, keep: { home: "keepA", homeP: 60, penP: 10, savP: 50, debt: "equal" } };
function App() {
  const [s, setS] = useState(load), [, tick] = useState(0);
  const up = (p) => setS((o) => { const n = { ...o, ...p }; KIT.save(KEY, n); return n; });
  useEffect(() => KIT.subscribe(() => tick((n) => n + 1)), []);
  useEffect(() => window.Journey.subscribe(() => setS(fresh())), []);
  useEffect(() => { window.scrollTo(0, 0); }, [s.phase]);
  const set = (p) => { up({ d: { ...s.d, ...p } }); KIT.setStatus("split", "started"); KIT.progress(); };
  const done = (r) => { up({ phase: "summary" }); KIT.setStatus("split", "done"); KIT.log("split-done", "Wrote up the agreement", "split", `${Math.round(r.s)}% / ${100 - Math.round(r.s)}% · ${r.tags.all[0]}`, { step: "Summary" }); };
  const P = KIT.PERSONA;
  const H = { figures: ["What there is", "to share."], plan: ["Try it different ways,", "and see how it looks."], summary: ["Your agreement,", "in plain English."] }[s.phase];
  const L = { figures: "Start from your agreed figures. Nothing here is decided until you both say so.", plan: "Move anything. Each decision shows how a court would likely see it, and why.", summary: "Read it through together. When you’re both happy, get it written up properly." }[s.phase];
  return (
    <div className="site bg-paper" style={{ minHeight: "100vh" }} data-screen-label={"MVP 06 · " + { figures: "Figures", plan: "Plan", summary: "Agreement summary" }[s.phase]}>
      <window.KitTop tool/>
      <main className="kit-wrap">
        <window.KitHead kick={`Agree what’s fair · ${P.me} and ${P.them}`} title={H[0]} em={H[1]} lede={L}/>
        {s.phase === "figures" && <SPFigures onNext={() => up({ phase: "plan" })}/>}
        {s.phase === "plan" && <SPPlan d={s.d} set={set} onDone={done}/>}
        {s.phase === "summary" && <SPSummary d={s.d} onEdit={() => up({ phase: "plan" })}/>}
      </main>
      <TweaksPanel title="Tweaks · MVP 06">
        <TweakSection label="Jump to"/>
        <TweakSelect label="Screen" value={s.phase} options={[["figures", "Figures"], ["plan", "Plan"], ["summary", "Agreement summary"]].map(([value, label]) => ({ value, label }))} onChange={(v) => up({ phase: v })}/>
        <TweakSection label="Try a plan"/>
        <TweakButton label="Even split, pensions as they are" onClick={() => up({ d: { ...SP.DEF } })}/>
        <TweakButton label="Likely fair (delay the sale)" onClick={() => up({ d: PRESET.fair })}/>
        <TweakButton label="Sarah keeps the house (a stretch)" onClick={() => up({ d: PRESET.keep })}/>
        <TweakToggle label="Children under 18" value={KIT.kids()} onChange={(v) => KIT.write({ kids: v })}/>
        <TweakButton label="Start again" onClick={() => { KIT.drop(KEY); setS(fresh()); }}/>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
