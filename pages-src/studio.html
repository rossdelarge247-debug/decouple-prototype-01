<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#17141F;--sub:#5C5668;--line:#E6E2EE;--v:#7C3AED;--paper:#F7F5F2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.r-lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:#17141F;position:relative;overflow:hidden}
.r-lock:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 82% 10%,rgba(124,58,237,.38),transparent 60%),radial-gradient(ellipse 50% 60% at 6% 100%,rgba(4,120,87,.22),transparent 60%)}
.r-lock-c{position:relative;width:100%;max-width:400px;display:grid;gap:12px;padding:34px 32px 28px;border-radius:24px;background:#FFF;box-shadow:0 40px 100px -20px rgba(0,0,0,.5)}
.r-lock-k{display:flex;align-items:center;gap:7px;font:600 10.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--v)}
.wm{font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--ink);margin-top:6px}
.wm i{font-style:normal;color:var(--v)}
h1{margin:4px 0 0;font:400 32px/1.1 'Source Serif Pro',Georgia,serif;letter-spacing:-.015em}
p{margin:0 0 6px;font-size:13.5px;line-height:1.5;color:var(--sub)}
label{font:600 12px Inter,sans-serif;color:var(--sub)}
input{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;font:15px Inter,sans-serif;outline:0;color:var(--ink)}
input:focus{border-color:var(--v)}
button{height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--v);color:#FFF;font:600 15px Inter,sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--v);outline-offset:2px}
.err{min-height:18px;font-size:12.5px;color:#B91C1C}
</style>
</head>
<body>
<div class="r-lock">
<form class="r-lock-c" id="f" novalidate>
<div class="r-lock-k">Private</div>
<span class="wm">Decouple<i>.</i></span>
<h1>Sign in</h1>
<p>Enter your password to continue.</p>
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password" autofocus required>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<button type="submit" id="go">Sign in</button>
</form>
</div>
<script>
(function(){
var f=document.getElementById('f'),p=document.getElementById('p'),err=document.getElementById('err'),go=document.getElementById('go');
function next(){var n=new URLSearchParams(location.search).get('next')||'';if(n.charAt(0)!=='/'||n.charAt(1)==='/'||n.charAt(1)==='\\')n='/hub';return n}
f.addEventListener('submit',async function(e){
e.preventDefault();err.textContent='';if(!p.value){err.textContent='Enter your password.';p.focus();return}
go.disabled=true;go.textContent='Signing in…';
try{var r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});
if(r.ok){location.replace(next());return}
err.textContent=r.status===429?'Too many attempts. Wait a few minutes.':r.status===503?'Sign-in is not set up yet.':'That is not the password.'}
catch(x){err.textContent='Could not reach the site. Try again.'}
go.disabled=false;go.textContent='Sign in';p.select()});
})();
</script>
</body>
</html>
