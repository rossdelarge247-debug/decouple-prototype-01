<!DOCTYPE html>
<html lang="en" data-stage="interview">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Decouple — Proto 02 · Interview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto/discover/discover.css">
<link rel="stylesheet" href="proto/interview/iv.css">
<style>html,body{margin:0;background:#F5F5F4}a{color:#5B21B6}a:hover{color:#7C3AED}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="proto/journey-store.js"></script>
<script src="proto/ut/ut-questions.js"></script>
<script src="proto/ut/ut.js"></script>
<script src="proto/proto-chrome.js"></script>
<script src="proto/interview/iv-data.js"></script>
<script type="text/babel" src="proto/discover/parts.jsx"></script>
<script type="text/babel" src="proto/interview/iv-ui.jsx"></script>
<script type="text/babel" src="proto/interview/iv-screens.jsx"></script>
<script type="text/babel" src="proto/tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const J = window.Journey, IV = window.IV, Ic = window.DIc;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "paper"
}/*EDITMODE-END*/;
const TKEY = "decouple.proto.ivTheme";

function useMobile() {
  const mq = "(max-width: 760px)";
  const [m, setM] = useState(matchMedia(mq).matches);
  useEffect(() => { const l = matchMedia(mq), f = () => setM(l.matches); l.addEventListener("change", f); return () => l.removeEventListener("change", f); }, []);
  return m;
}
function initAnswers() {
  const st = J.get(), iv = st.interview || {}, r = st.router || {};
  const a = { ...(iv.answers || {}) }; a.__pre = { ...(a.__pre || {}) };
  if (!a.stage && r.stage) { a.stage = r.stage; a.__pre.stage = true; }
  if (!a.status && (r.status || iv.status)) { a.status = r.status || iv.status; a.__pre.status = true; }
  return a;
}
function buildScreens(a, mobile) {
  const out = [{ k: "intro" }];
  IV.activeSections(a).forEach((s) => {
    const qs = IV.secQs(s.id, a);
    if (!mobile) { out.push({ k: "sec:" + s.id, sec: s, qs }); return; }
    qs.forEach((q, i) => {
      if (q.type === "note") { if (out.length) out[out.length - 1].qs.push(q); return; }
      out.push({ k: "q:" + q.id, sec: s, qs: [q], first: i === 0 });
    });
  });
  out.push({ k: "build" });
  return out;
}
function resolve(list, pos) {
  let i = list.findIndex((s) => s.k === pos);
  if (i >= 0 || !pos) return Math.max(0, i);
  if (pos.startsWith("q:")) { const q = IV.Q.find((x) => "q:" + x.id === pos); i = list.findIndex((s) => s.k === "sec:" + (q && q.sec)); }
  else if (pos.startsWith("sec:")) { const sid = pos.slice(4); i = list.findIndex((s) => s.sec && s.sec.id === sid); }
  return Math.max(0, i);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [mirror, setMirror] = useState(localStorage.getItem(TKEY));
  useEffect(() => { if (!J.embedded) localStorage.setItem(TKEY, t.theme); }, [t.theme]);
  useEffect(() => { const f = (e) => e.key === TKEY && setMirror(e.newValue); addEventListener("storage", f); return () => removeEventListener("storage", f); }, []);
  const theme = J.embedded ? (mirror || t.theme) : t.theme;

  const mobile = useMobile();
  const [a, setA] = useState(initAnswers);
  const [pos, setPos] = useState((J.get().interview || {}).pos || "intro");
  const [stop, setStop] = useState(false);
  const [save, setSave] = useState(false);
  const [exit, setExit] = useState(false);
  const [sheet, setSheet] = useState(false);
  const list = useMemo(() => buildScreens(a, mobile), [a, mobile]);
  const idx = resolve(list, pos), scr = list[idx];
  useEffect(() => { if (!stop) J.set("interview", { answers: a, pos: scr.k }); }, [a, scr.k, stop]);
  useEffect(() => { window.scrollTo(0, 0); }, [scr.k, stop]);

  const set = (id, v) => setA((p) => { const pre = { ...(p.__pre || {}) }; delete pre[id]; return { ...p, [id]: v, __pre: pre }; });
  const confirm = (ids) => setA((p) => { const pre = { ...(p.__pre || {}) }; ids.forEach((i) => delete pre[i]); return { ...p, __pre: pre }; });
  const preIds = scr.qs ? scr.qs.filter((q) => (a.__pre || {})[q.id]).map((q) => q.id) : [];
  const optional = scr.sec && IV.isOptionalSec(scr.sec, a);
  const can = !scr.qs || optional || scr.qs.every((q) => (q.type === "safe" ? !!a.safe : IV.answered(q, a)));
  const go = (n) => setPos(list[Math.max(0, Math.min(list.length - 1, n))].k);
  const next = () => {
    if (!can) return;
    if (preIds.length) confirm(preIds);
    if (scr.sec && scr.sec.id === "safety") {
      const after = { ...a };
      if (after.safe === "unsafe" || (scr.k !== "q:safe" && IV.safetyStop(after))) { setStop(true); return; }
    }
    go(idx + 1);
  };
  const back = () => { if (stop) { setStop(false); setA((p) => ({ ...p, safe: undefined, safe2: undefined })); return; } go(idx - 1); };
  useEffect(() => {
    const k = (e) => { if (/INPUT|TEXTAREA/.test(e.target.tagName) || save || exit) return; if (e.key === "Enter" || e.key === "ArrowRight") { if (scr.k === "intro") go(1); else if (scr.qs) next(); } if (e.key === "ArrowLeft" && idx > 0) back(); };
    addEventListener("keydown", k); return () => removeEventListener("keydown", k);
  });

  const secs = IV.activeSections(a);
  const secNo = scr.sec ? secs.findIndex((s) => s.id === scr.sec.id) + 1 : 0;
  const pct = stop ? 100 : (idx / (list.length - 1)) * 100;
  const panelPct = Math.round((IV.PANEL.filter(([, f]) => f(a)).length / IV.PANEL.length) * 100);
  const bg = theme === "wash" ? "bg-wash" : "bg-paper";
  const isQ = !!scr.qs && !stop;
  const head = scr.sec && (mobile && !scr.first && scr.qs[0].type !== "safe" ? IV.labelOf(scr.qs[0], a) || scr.sec.title : scr.sec.title);
  const helper = scr.sec && (mobile && !scr.first ? scr.qs[0].helper : scr.sec.helper);
  const cta = preIds.length ? "Yes, that's right" : idx === list.length - 2 ? "See my picture" : "Continue";

  if (exit) return <IVNeutral onBack={() => setExit(false)}/>;
  return (
    <div className={"site iv " + bg} data-screen-label={"Interview · " + (stop ? "Safety stop" : scr.k)}>
      <header className="iv-top">
        <div className="l"><span className="wm" style={{ cursor: "default" }}>Decouple<i>.</i></span><small>Free interview</small></div>
        <div className="r">
          {isQ && <button className="pillbtn pic" onClick={() => setSheet(true)}><Ic.Lock s={12}/> Picture · {panelPct}%</button>}
          {!stop && <button className="pillbtn save" onClick={() => setSave(true)}>Save & finish later</button>}
          <button className="pillbtn exit" onClick={() => setExit(true)}><Ic.X s={12} c="#B91C1C"/> Quick exit</button>
        </div>
      </header>
      <div className="iv-prog"><div className="track"><i style={{ width: pct + "%", background: stop ? "#B91C1C" : undefined }}></i></div></div>
      <main className="iv-body">
        {stop ? <IVStop onBack={back}/>
        : scr.k === "intro" ? <IVIntro a={a} onStart={() => go(1)}/>
        : scr.k === "build" ? <IVBuild a={a}/>
        : (
          <div className="iv-grid">
            <div style={{ "--c": scr.sec.c }}>
              {IV.exploring(a) && <div className="iv-banner"><Ic.Spark s={12}/> Just exploring — nothing here commits you to anything.</div>}
              <div className="iv-kick">{scr.sec.id === "safety" ? "A quick check-in" : scr.sec.name}<span>step {secNo} of {secs.length}</span></div>
              <h2 className="iv-h">{head}</h2>
              {helper && <p className="iv-help">{helper}</p>}
              <div className="qs">
                {scr.qs.map((q) => q.type === "safe"
                  ? <IVSafeQ key={q.id} a={a} set={set}/>
                  : <IVQBlock key={q.id} q={q} a={a} set={set} pre={(a.__pre || {})[q.id]} onConfirm={() => confirm([q.id])} solo={mobile && !scr.first}/>)}
              </div>
              <div className="iv-nav desk">
                <button className="back" onClick={back}><Ic.Arrow s={14} style={{ transform: "rotate(180deg)" }}/> Back</button>
                <button className="btn lg" disabled={!can} onClick={next}>{cta} <Ic.Arrow s={15}/></button>
                {optional && !scr.qs.every((q) => IV.answered(q, a)) ? <button className="skipsec" onClick={() => go(idx + 1)}>Skip this for now</button> : <span className="hint">or press Enter</span>}
              </div>
            </div>
            <aside className="iv-side"><IVPanel a={a} curSec={scr.sec.id}/></aside>
          </div>
        )}
      </main>
      {isQ && (
        <div className="mnav">
          <div className="row">
            <button className="back" aria-label="Back" onClick={back}><Ic.Arrow s={16} style={{ transform: "rotate(180deg)" }}/></button>
            <button className="btn lg" disabled={!can} onClick={next}>{cta} <Ic.Arrow s={15}/></button>
          </div>
          <button className="sv" onClick={() => optional && !IV.answered(scr.qs[0], a) ? go(idx + 1) : setSave(true)}>{optional && !IV.answered(scr.qs[0], a) ? "Skip this for now" : "Save & finish later"}</button>
        </div>
      )}
      {sheet && <div className="psheet" onClick={(e) => e.target === e.currentTarget && setSheet(false)}><div><IVPanel a={a} curSec={scr.sec && scr.sec.id}/><button className="btn lg full" style={{ marginTop: 16 }} onClick={() => setSheet(false)}>Back to the question</button></div></div>}
      {save && <IVSave onClose={() => setSave(false)}/>}
      <TweaksPanel>
        <TweakSection label="Look & feel"/>
        <TweakRadio label="Background" value={t.theme} options={[{ value: "paper", label: "Paper" }, { value: "wash", label: "Lilac" }]} onChange={(v) => setTweak("theme", v)}/>
        <TweakSection label="Jump to a path"/>
        <TweakButton label="Reset interview" onClick={() => { setStop(false); J.set("interview", { answers: null, pos: "intro" }); setA(initAnswers()); setPos("intro"); }}/>
        <TweakButton label="Exploring path" onClick={() => { setStop(false); setA({ stage: "considering", status: "married", __pre: {} }); setPos("intro"); }}/>
        <TweakButton label="Mostly-agreed path" onClick={() => { setStop(false); setA({ stage: "agreed", status: "married", __pre: {} }); setPos("intro"); }}/>
        <TweakButton label="Cohabiting path" onClick={() => { setStop(false); setA({ stage: "apart", status: "cohab", __pre: {} }); setPos("intro"); }}/>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
